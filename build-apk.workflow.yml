name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  JAVA_HOME: ${{ github.workspace }}/java

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --clean

      - name: Build Debug APK
        if: github.event.inputs.buildType == 'debug' || github.event_name == 'push'
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Build Release APK
        if: github.event.inputs.buildType == 'release'
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1

      - name: Find APK
        id: find_apk
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
            echo "apk_name=app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.apk_name }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: APK Build v${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          body: |
            ## ShortVideoApp APK
            - **Build**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Time**: ${{ github.event.head_commit.timestamp }}
            
            ### 安装说明
            1. 下载 APK 文件
            2. 传到 Android 手机
            3. 在设置中允许安装未知来源应用
            4. 安装并开始使用！
