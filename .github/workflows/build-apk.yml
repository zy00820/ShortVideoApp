name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - '**.apk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 23.1.7779620

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd ShortVideoApp && npm install

      - name: Generate native project
        run: cd ShortVideoApp && npx expo prebuild --platform android

      - name: Update gradle.properties
        run: |
          echo "android.buildToolsVersion=34.0.0" >> ShortVideoApp/android/gradle.properties
          echo "android.minSdkVersion=28" >> ShortVideoApp/android/gradle.properties
          echo "android.compileSdkVersion=34" >> ShortVideoApp/android/gradle.properties
          echo "android.targetSdkVersion=34" >> ShortVideoApp/android/gradle.properties

      - name: Build APK
        run: |
          cd ShortVideoApp/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortVideoApp-APK
          path: ShortVideoApp/android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.1
          name: ShortVideoApp v1.0.1
          body: |
            ## 更新内容
            - 支持头像修改
            - 支持昵称修改
            - 优化用户资料编辑体验
          files: ShortVideoApp/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
